<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDoToRo — 지도 · 데스크톱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* 데스크톱 웹 전용. 1280px 미만에서는 레이아웃을 줄이지 않고 가로 스크롤한다 —
     좁은 폭에 억지로 맞추면 패널이 눌려 모바일도 데스크톱도 아닌 화면이 된다 */
  html, body { height: 100%; }
  body { overflow-x: auto; overflow-y: hidden; }
  .app { height: 100vh; min-width: 1280px; display: grid; grid-template-rows: 57px 1fr; }

  .topbar {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-5);
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
  .brand-sub { font-size: 14px; color: var(--muted); letter-spacing: 0.012em; }
  .topbar .spacer { flex: 1; }

  .stage { display: grid; grid-template-columns: var(--panel-w) 1fr; min-height: 0; }
  @media (min-width: 1600px) { .stage { grid-template-columns: 416px 1fr; } }

  /* ── 패널 ─────────────────────────────── */
  .panel { display: flex; flex-direction: column; min-height: 0;
           background: var(--surface); border-right: 1px solid var(--border); }
  .searchbar { padding: var(--sp-3); border-bottom: 1px solid var(--border); position: relative; }
  .search {
    width: 100%; height: 48px; padding: 0 14px;
    font-family: var(--font-body); font-size: 16px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--border-str);
  }
  .search::placeholder { color: var(--hint); }
  .search:focus { outline: 2px solid var(--fg); outline-offset: -2px; border-color: var(--fg); }

  .results { border-bottom: 1px solid var(--border); max-height: 340px; overflow: auto; }
  .result {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--sp-2);
    width: 100%; min-height: var(--tap); padding: var(--sp-3) var(--sp-4);
    background: none; border: 0; border-bottom: 1px solid var(--border);
    font-family: var(--font-body); text-align: left; cursor: pointer;
  }
  .result:hover { background: var(--sunken); }
  .result-jibun { font-family: var(--font-display); font-size: 17px; letter-spacing: -0.01em; }
  .result-meta { font-size: 14px; color: var(--muted); }
  .result-rate { font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }

  /* 고정 요약 카드 — 스크롤되지 않는다 */
  .summary { padding: var(--sp-4) var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
  .sum-head { display: grid; grid-template-columns: 88px 1fr auto; gap: var(--sp-4); align-items: start; }
  .addr-town { font-size: 14px; color: var(--muted); letter-spacing: 0.012em; }
  .close {
    width: var(--tap); height: var(--tap); margin: -6px -6px 0 0;
    display: grid; place-items: center;
    background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer;
  }
  .close:hover { border-color: var(--border-str); background: var(--sunken); color: var(--fg); }
  .total-row { margin-top: var(--sp-5); display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
  .basis {
    font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.02em;
    color: var(--muted); border: 1px solid var(--border); padding: 1px 7px;
  }
  .unit { margin-top: var(--sp-2); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 탭 */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg);
          border-bottom: 1px solid var(--border); }
  .tab {
    height: 50px; padding: 0 var(--sp-2);
    background: none; border: 0; border-bottom: 2px solid transparent;
    font-family: var(--font-body); font-size: 16px; font-weight: 500; color: var(--muted);
    cursor: pointer;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); font-weight: 600; background: var(--surface);
                               border-bottom-color: var(--fg); }
  .tabbody { flex: 1; min-height: 0; overflow: auto; }
  .sec { padding: var(--sp-5) var(--sp-4); border-bottom: 1px solid var(--border); }
  .sec-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .empty { padding: var(--sp-10) var(--sp-6); text-align: center; color: var(--muted); }
  .empty svg { margin-bottom: var(--sp-4); }

  /* 시세 추이 차트 */
  .chart { width: 100%; height: 156px; display: block; }
  .chart .bar { fill: var(--p3); }
  .chart .bar.now { fill: var(--p5); }
  .chart .yr { font-family: var(--font-body); font-size: 14px; fill: var(--muted); text-anchor: middle; }
  .chart .val { font-family: var(--font-body); font-size: 14px; fill: var(--fg); text-anchor: middle;
                font-variant-numeric: tabular-nums; }
  .delta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 주변 목록 */
  .near { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .near-row {
    display: grid; grid-template-columns: 22px 1fr auto; gap: var(--sp-3); align-items: center;
    background: var(--surface); padding: var(--sp-3) 0; min-height: var(--tap);
  }
  .near-name { font-size: 16px; }
  .near-sub { font-size: 14px; color: var(--muted); }
  .near-dist { font-size: 16px; font-variant-numeric: tabular-nums; text-align: right; }
  .near-dist span { display: block; font-size: 14px; color: var(--muted); }
  .ico { stroke: var(--fg); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ph-line { height: 13px; background: var(--sunken); border: 1px solid var(--border); }

  .panel-foot { padding: var(--sp-4); border-top: 1px solid var(--border); background: var(--surface); }

  /* ── 지도 ─────────────────────────────── */
  .map { position: relative; overflow: hidden; background: oklch(96% 0.006 100); }
  #map { width: 100%; height: 100%; display: block; }
  .parcel { stroke: #fff; stroke-width: 0.5; vector-effect: non-scaling-stroke; cursor: pointer; }
  .parcel:hover { stroke: var(--fg); stroke-width: 1.2; }
  .parcel.sel { stroke: var(--fg); stroke-width: 2.2; fill-opacity: 1; }
  /* --k = viewBox폭 / 화면폭. 곱해두면 줌·창크기와 무관하게 글자가 화면상 그 px가 된다 */
  #map { --k: 1; }
  .plabel { font-family: var(--font-body); font-size: calc(14px * var(--k)); fill: var(--fg);
            text-anchor: middle; pointer-events: none; opacity: 0.9;
            paint-order: stroke; stroke: oklch(100% 0 0 / 0.6); stroke-width: calc(2.5px * var(--k)); }
  .placename { font-family: var(--font-body); font-size: calc(15px * var(--k)); font-weight: 500;
               fill: oklch(38% 0.014 70); text-anchor: middle; pointer-events: none;
               paint-order: stroke; stroke: oklch(100% 0 0 / 0.8); stroke-width: calc(3.5px * var(--k)); }
  .townpill { cursor: default; }
  .townpill rect { fill: var(--surface); stroke: var(--border-str); }
  /* 칩 내부는 1 user unit = 1 화면 px로 스케일해두므로 아래 값이 그대로 화면 px다 */
  .townpill .tn { font-family: var(--font-body); font-size: 15px; font-weight: 500; fill: var(--fg); }
  .townpill .tv { font-family: var(--font-body); font-size: 15px; fill: var(--fg);
                  font-variant-numeric: tabular-nums; }
  .townpill .tu { font-family: var(--font-body); font-size: 14px; fill: var(--muted); }

  .legend { position: absolute; left: var(--sp-4); bottom: var(--sp-4); width: 268px;
            background: var(--surface); border: 1px solid var(--border); padding: var(--sp-3) var(--sp-4); }
  .legend-title { font-size: 14px; font-weight: 500; margin-bottom: var(--sp-2); }
  .legend-ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted);
                 margin-top: 6px; font-variant-numeric: tabular-nums; }
  .legend-none { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3);
                 font-size: 14px; color: var(--muted); }
  .swatch-none { width: 16px; height: 12px; border: 1px solid var(--border-str);
    background: repeating-linear-gradient(45deg, var(--p0) 0 2px, oklch(80% 0.006 95) 2px 3px); }

  .zoomctl { position: absolute; right: var(--sp-4); top: var(--sp-4);
             display: flex; flex-direction: column; background: var(--surface);
             border: 1px solid var(--border-str); }
  .zoombtn { width: var(--tap); height: var(--tap); display: grid; place-items: center;
             background: none; border: 0; cursor: pointer; color: var(--fg); font-size: 20px; }
  .zoombtn:hover { background: var(--sunken); }
  .zoombtn + .zoombtn { border-top: 1px solid var(--border); }
  .zlevel { position: absolute; right: var(--sp-4); top: calc(var(--sp-4) + 96px);
            font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.03em; color: var(--muted);
            background: var(--surface); border: 1px solid var(--border); padding: 2px 8px; }

  .toast { position: absolute; left: 50%; top: var(--sp-4); transform: translateX(-50%);
           background: var(--surface); border: 1px solid var(--border-str);
           padding: var(--sp-2) var(--sp-4); font-size: 14px; color: var(--fg);
           opacity: 0; transition: opacity 160ms ease; pointer-events: none; }
  .toast.on { opacity: 1; }
  .mapnote { position: absolute; right: var(--sp-4); bottom: var(--sp-4); font-size: 14px;
             color: var(--muted); background: oklch(100% 0 0 / 0.82); padding: 2px 8px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar" data-od-id="app-header">
    <span class="brand">DDoToRo</span>
    <span class="brand-sub">경기 양평군 땅값 조회</span>
    <span class="spacer"></span>
    <span class="badge">시안 데이터 · 필지 34만 건 중 표본</span>
  </header>

  <div class="stage">
    <!-- ─────────── 좌측 패널 ─────────── -->
    <aside class="panel" data-od-id="detail-panel">
      <div class="searchbar" data-od-id="search-box">
        <input class="search" id="q" type="search" placeholder="서종면 245-7" aria-label="지번으로 필지 검색"
               autocomplete="off">
      </div>
      <div class="results" id="results" hidden data-od-id="search-results"></div>

      <div id="detail" style="display:flex;flex-direction:column;min-height:0;flex:1"></div>

      <div id="emptystate" class="empty" data-od-id="panel-empty">
        <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
          <path d="M8 16 L20 10 L34 16 L44 11 L44 38 L32 43 L18 37 L8 42 Z"
                fill="none" stroke="oklch(82% 0.008 95)" stroke-width="1.4"/>
          <path d="M20 10 L20 37 M34 16 L34 43" stroke="oklch(82% 0.008 95)" stroke-width="1.4"/>
        </svg>
        <div class="t-body">지도에서 땅을 눌러 보세요</div>
        <div class="t-label" style="margin-top:8px">지번으로 찾을 수도 있습니다</div>
      </div>
    </aside>

    <!-- ─────────── 지도 ─────────── -->
    <main class="map" data-od-id="map-canvas">
      <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" role="img"
           aria-label="양평군 필지 지도">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="var(--p0)"/>
            <line x1="0" y1="0" x2="0" y2="6" stroke="oklch(80% 0.006 95)" stroke-width="1.6"/>
          </pattern>
        </defs>
        <g id="basemap"></g>
        <g id="parcelLayer"></g>
        <g id="labelLayer"></g>
        <g id="townLayer"></g>
      </svg>

      <div class="toast" id="toast"></div>

      <div class="zoomctl" data-od-id="zoom-control">
        <button class="zoombtn" id="zin" aria-label="확대">+</button>
        <button class="zoombtn" id="zout" aria-label="축소">−</button>
      </div>
      <div class="zlevel" id="zlevel">z15</div>

      <div class="legend" id="legend" data-od-id="map-legend"></div>
      <div class="mapnote">지적도 · 공시지가 2026년 기준</div>
    </main>
  </div>
</div>

<script src="assets/parcels.js"></script>
<script>
(function () {
  'use strict';
  var D = window.DDO;
  var parcels = D.build();
  var byId = {};
  parcels.forEach(function (p) { byId[p.id] = p; });

  var ZOOMS = [
    { z: 13, w: 1000 }, { z: 14, w: 720 }, { z: 15, w: 455 }, { z: 16, w: 300 }, { z: 17, w: 196 }
  ];
  var view = { zi: 2, cx: 300, cy: 205 };
  var selected = null, activeTab = 'info';

  var $ = function (id) { return document.getElementById(id); };
  var svg = $('map');

  /* ── 배경지도: 산림·강·도로·지명 ───────────── */
  function drawBase() {
    var g = $('basemap'), out = [];
    out.push('<rect x="0" y="0" width="1000" height="700" fill="oklch(96.5% 0.006 100)"/>');
    // 산림 — 필지 사이 빈 구획으로도 비쳐 보이므로 아주 옅게
    [[120, 90, 130, 78], [640, 96, 165, 84], [890, 220, 120, 96], [150, 620, 150, 74],
     [760, 600, 175, 82], [420, 92, 96, 58]].forEach(function (e) {
      out.push('<ellipse cx="' + e[0] + '" cy="' + e[1] + '" rx="' + e[2] + '" ry="' + e[3] +
               '" fill="oklch(95.5% 0.012 140)"/>');
    });
    // 남한강
    var top = D.RIVER.map(function (p) { return p[0] + ' ' + (p[1] - 38); }).join('L');
    var bot = D.RIVER.slice().reverse().map(function (p) { return p[0] + ' ' + (p[1] + 38); }).join('L');
    out.push('<path d="M' + top + 'L' + bot + 'Z" fill="oklch(89% 0.032 232)"/>');
    // 도로
    D.ROADS.forEach(function (pts, i) {
      var d = 'M' + pts.map(function (p) { return p[0] + ' ' + p[1]; }).join('L');
      out.push('<path d="' + d + '" fill="none" stroke="oklch(88% 0.028 82)" stroke-width="' +
               (i === 0 ? 7 : 5) + '" stroke-linecap="round"/>');
      out.push('<path d="' + d + '" fill="none" stroke="oklch(97% 0.012 90)" stroke-width="' +
               (i === 0 ? 3 : 2) + '"/>');
    });
    // 지명·지형지물
    [['남한강', 560, 352], ['6번 국도', 210, 238], ['용문산', 645, 84],
     ['양평역', 462, 318], ['양평군청', 486, 348], ['오빈역', 372, 306]].forEach(function (t) {
      out.push('<text class="placename" x="' + t[1] + '" y="' + t[2] + '">' + t[0] + '</text>');
    });
    g.innerHTML = out.join('');
  }

  /* ── 필지 ─────────────────────────────── */
  function fillOf(p) { return p.bin === 0 ? 'url(#hatch)' : 'var(--p' + p.bin + ')'; }

  function drawParcels() {
    var g = $('parcelLayer'), out = [];
    parcels.forEach(function (p) {
      out.push('<path class="parcel" id="s-' + p.id + '" data-id="' + p.id + '" d="' + D.pathOf(p.pts) +
               '" fill="' + fillOf(p) + '" fill-opacity="0.72"' +
               ' tabindex="-1" role="button" aria-label="' + p.ri + ' ' + p.jibun + '"></path>');
    });
    g.innerHTML = out.join('');
    g.addEventListener('click', function (e) {
      var id = e.target.getAttribute && e.target.getAttribute('data-id');
      if (id) select(id, false);
    });
  }

  function drawTowns() {
    var g = $('townLayer');
    if (ZOOMS[view.zi].z >= 15) { g.innerHTML = ''; return; }
    var s = scaleK();                       // 줌·창크기와 무관하게 칩 크기 고정
    var out = [];
    D.TOWNS.forEach(function (t) {
      var label = D.num(D.ratePyeong(t.rate)) + '원';
      var w = 132, h = 48;
      out.push('<g class="townpill" transform="translate(' + (t.x) + ',' + (t.y) + ') scale(' + s +
        ') translate(' + (-w / 2) + ',' + (-h / 2) + ')">' +
        '<rect x="0" y="0" width="' + w + '" height="' + h + '"/>' +
        '<text class="tn" x="11" y="20">' + t.name + '</text>' +
        '<text class="tv" x="11" y="39">' + label + '</text>' +
        '<text class="tu" x="' + (w - 11) + '" y="39" text-anchor="end">평당</text>' +
        '</g>');
    });
    g.innerHTML = out.join('');
  }

  function drawLabels() {
    var g = $('labelLayer');
    if (ZOOMS[view.zi].z < 17) { g.innerHTML = ''; return; }
    var vb = viewBox(), out = [];
    parcels.forEach(function (p) {
      if (p.cx < vb[0] || p.cx > vb[0] + vb[2] || p.cy < vb[1] || p.cy > vb[1] + vb[3]) return;
      out.push('<text class="plabel" x="' + p.cx.toFixed(0) + '" y="' + (p.cy + 3).toFixed(0) + '">' +
               p.jibun + '</text>');
    });
    g.innerHTML = out.join('');
  }

  function viewBox() {
    var w = ZOOMS[view.zi].w, h = w * 0.7;
    var x = Math.max(0, Math.min(1000 - w, view.cx - w / 2));
    var y = Math.max(0, Math.min(700 - h, view.cy - h / 2));
    return [x, y, w, h];
  }

  // viewBox 단위 → 화면 px 환산 계수. preserveAspectRatio="slice"라 폭 기준으로 맞춘다
  function scaleK() {
    var w = svg.clientWidth || 1000;
    var h = svg.clientHeight || 700;
    var vbW = ZOOMS[view.zi].w;
    var per = Math.max(w / vbW, h / (vbW * 0.7));   // slice: 큰 쪽에 맞춰 잘린다
    return 1 / per;
  }

  function applyView() {
    var vb = viewBox();
    svg.setAttribute('viewBox', vb.join(' '));
    svg.style.setProperty('--k', String(scaleK()));
    var z = ZOOMS[view.zi].z;
    $('zlevel').textContent = 'z' + z;
    $('parcelLayer').style.display = z >= 15 ? '' : 'none';
    drawTowns(); drawLabels(); drawLegend();
    $('zin').disabled = view.zi === ZOOMS.length - 1;
    $('zout').disabled = view.zi === 0;
    if (z === 15) flash('필지가 많아 일부만 표시됩니다 · 3,000건');
  }

  var toastTimer = null;
  function flash(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  function drawLegend() {
    var z = ZOOMS[view.zi].z, L = $('legend');
    if (z < 15) {
      L.innerHTML =
        '<div class="legend-title">읍면별 현재 시세</div>' +
        '<div class="t-label">최근 3년 실거래 중앙값 · 평당</div>' +
        '<div class="legend-none" style="margin-top:10px">확대하면 필지별 공시지가로 바뀝니다</div>';
      return;
    }
    var b = D.BINS;
    L.innerHTML =
      '<div class="legend-title">㎡당 공시지가</div>' +
      '<div class="ramp" aria-hidden="true">' +
        '<i style="background:var(--p1)"></i><i style="background:var(--p2)"></i>' +
        '<i style="background:var(--p3)"></i><i style="background:var(--p4)"></i>' +
        '<i style="background:var(--p5)"></i></div>' +
      '<div class="legend-ends"><span>' + D.num(b[0]) + '원</span><span>' + D.num(b[3]) + '원 이상</span></div>' +
      '<div class="legend-none"><span class="swatch-none"></span>정보 없음 (0.448%)</div>';
  }

  /* ── 상세 패널 ─────────────────────────── */
  function tabBtn(id, label) {
    return '<button class="tab" role="tab" data-tab="' + id + '" aria-selected="' +
           (activeTab === id ? 'true' : 'false') + '">' + label + '</button>';
  }

  function icon(name) {
    var p = {
      train: '<rect x="5" y="3" width="12" height="13" rx="2"/><path d="M8 19l-2 2M14 19l2 2M5 12h12M9 7h4"/>',
      school: '<path d="M11 3 3 7l8 4 8-4-8-4Z"/><path d="M6 10v5c0 1.7 2.2 3 5 3s5-1.3 5-3v-5"/>',
      hospital: '<path d="M11 5v12M5 11h12"/><rect x="2.5" y="2.5" width="17" height="17" rx="3"/>',
      store: '<path d="M4 8h14l-1 11H5L4 8Z"/><path d="M8 8V6a3 3 0 0 1 6 0v2"/>',
      office: '<rect x="4" y="3" width="14" height="16" rx="1"/><path d="M8 7h2M12 7h2M8 11h2M12 11h2M9 19v-4h4v4"/>',
      bus: '<rect x="4" y="4" width="14" height="11" rx="2"/><path d="M4 10h14M7 18v1M15 18v1"/>'
    }[name];
    return '<svg width="22" height="22" viewBox="0 0 22 22" class="ico" aria-hidden="true">' + p + '</svg>';
  }

  function chart(p) {
    var h = D.history(p.rate);
    var max = Math.max.apply(null, h.map(function (d) { return d.rate; }));
    var W = 336, bw = 40, gap = (W - h.length * bw) / (h.length - 1);
    var top = 34, base = 118;
    var bars = h.map(function (d, i) {
      var x = i * (bw + gap);
      var bh = Math.max(4, (d.rate / max) * (base - top));
      var isNow = i === h.length - 1;
      return '<rect class="bar' + (isNow ? ' now' : '') + '" x="' + x.toFixed(1) + '" y="' +
             (base - bh).toFixed(1) + '" width="' + bw + '" height="' + bh.toFixed(1) + '"/>' +
             '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (base - bh - 9).toFixed(1) + '">' +
             Math.round(d.rate / 1000) + '천</text>' +
             '<text class="yr" x="' + (x + bw / 2).toFixed(1) + '" y="' + (base + 20) + '">' + d.year + '</text>';
    }).join('');
    var pct = Math.round((h[4].rate / h[0].rate - 1) * 100);
    return '<svg class="chart" viewBox="0 0 336 148" role="img" aria-label="연도별 ㎡당 공시지가">' +
             bars + '<line x1="0" y1="118.5" x2="336" y2="118.5" stroke="var(--border-str)"/></svg>' +
           '<div class="delta">2022년 대비 ' + (pct >= 0 ? '+' : '') + pct + '% · 단위 ㎡당 원(천 단위)</div>';
  }

  function tabInfo(p) {
    return '<div class="sec" data-od-id="tab-info-basic">' +
      '<dl class="pairs">' +
        '<dt>지목</dt><dd>' + p.jimok + '</dd>' +
        '<dt>면적</dt><dd>' + D.areaText(p.area) + '</dd>' +
        '<dt>소재지</dt><dd>경기 양평군 ' + p.town + ' ' + p.ri + ' ' + p.jibun + '</dd>' +
        '<dt>고유번호</dt><dd class="t-mono" style="word-break:break-all">' + p.pnu + '</dd>' +
      '</dl></div>' +
      '<div class="sec"><div class="note" data-od-id="notice-official-price">' +
        '<strong>공시지가는 시세가 아닙니다.</strong><br>' +
        '연 1회(매년 1월 1일 기준) 공시되는 공적 가격으로, 실제 거래 시세와 다릅니다.' +
      '</div></div>';
  }

  function tabPrice(p) {
    if (p.rate == null) {
      return '<div class="sec"><div class="note">이 필지는 공시지가 정보가 없습니다. ' +
             '전체 필지의 0.448%가 여기에 해당합니다.</div></div>';
    }
    var t = D.TOWNS.filter(function (x) { return x.name === p.town; })[0] || D.TOWNS[0];
    return '<div class="sec" data-od-id="tab-price-history">' +
        '<div class="sec-head"><h3 class="t-h3">공시지가 추이</h3>' +
          '<span class="badge">5년 · 원본 A16~A19</span></div>' +
        chart(p) +
        '<div class="t-label" style="margin-top:12px">2023년은 전국적으로 공시지가가 하락한 해입니다.</div>' +
      '</div>' +
      '<div class="sec" data-od-id="tab-price-deals">' +
        '<div class="sec-head"><h3 class="t-h3">' + p.town + ' 지역 실거래</h3></div>' +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
          '<span class="t-jibun">' + D.num(D.ratePyeong(t.rate)) + '원</span>' +
          '<span class="t-label">평당 중앙값 · ' + D.num(t.deals) + '건</span></div>' +
        '<div class="t-label" style="margin-top:2px">㎡당 ' + D.num(t.rate) + '원 · 최근 36개월</div>' +
        '<div class="note" style="margin-top:14px" data-od-id="notice-deal-average">' +
          '<strong>이 필지의 거래 기록이 아닙니다.</strong><br>' +
          '정부가 지번을 일부만 공개해 지역 평균으로만 보여드립니다.' +
        '</div>' +
      '</div>';
  }

  function tabNear(p) {
    var st = [['오빈역', '경의중앙선', 1.8], ['양평역', '경의중앙선', 4.6], ['양수역', '경의중앙선', 9.2]];
    var fac = [['school', '서종초등학교', '초등학교', 4.2], ['hospital', '서종보건지소', '보건지소', 3.1],
               ['store', '하나로마트 서종점', '마트', 2.7], ['office', '서종면사무소', '관공서', 2.9],
               ['bus', '문호리 정류장', '버스정류장', 0.4]];
    var rows = fac.map(function (f) {
      return '<div class="near-row">' + icon(f[0]) +
        '<div><div class="near-name">' + f[1] + '</div><div class="near-sub">' + f[2] + '</div></div>' +
        '<div class="near-dist">' + f[3].toFixed(1) + 'km<span>직선</span></div></div>';
    }).join('');
    var stRows = st.map(function (s, i) {
      return '<div class="near-row">' + (i === 0 ? icon('train') : '<span></span>') +
        '<div><div class="near-name">' + s[0] + '</div><div class="near-sub">' + s[1] + '</div></div>' +
        '<div class="near-dist">' + s[2].toFixed(1) + 'km<span>' +
        (i === 0 ? '차 ' + Math.round(s[2] * 3.6) + '분 추정' : '직선') + '</span></div></div>';
    }).join('');
    return '<div class="sec" data-od-id="tab-near-station">' +
        '<div class="sec-head"><h3 class="t-h3">가장 가까운 역</h3>' +
          '<span class="badge">표시 예시 · 좌표 연동 전</span></div>' +
        '<div class="near">' + stRows + '</div>' +
        '<div class="t-label" style="margin-top:10px">직선거리 기준입니다. ' +
          '산악 지형이라 실제 이동거리는 더 깁니다.</div>' +
      '</div>' +
      '<div class="sec" data-od-id="tab-near-facility">' +
        '<div class="sec-head"><h3 class="t-h3">주변 시설</h3>' +
          '<span class="badge">표시 예시 · 공공데이터 연동 전</span></div>' +
        '<div class="near">' + rows + '</div>' +
      '</div>' +
      '<div class="sec" data-od-id="tab-near-news" style="background:var(--bg)">' +
        '<div class="sec-head" style="margin-bottom:10px">' +
          '<h3 class="t-h3" style="font-weight:500;color:var(--muted)">지역 부동산 뉴스</h3>' +
          '<span class="badge">외부 API 연동 전</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:9px">' +
          '<div class="ph-line" style="width:92%"></div><div class="ph-line" style="width:74%"></div>' +
          '<div class="ph-line" style="width:83%"></div></div>' +
        '<div class="t-label" style="margin-top:12px">개별 필지와 직접 관련이 없어 패널 최하단에 둡니다.</div>' +
      '</div>';
  }

  function render() {
    var host = $('detail');
    if (!selected) { host.innerHTML = ''; $('emptystate').hidden = false; return; }
    $('emptystate').hidden = true;
    var p = byId[selected];
    var fill = p.bin === 0 ? 'url(#hatch2)' : 'var(--p' + p.bin + ')';

    var body = activeTab === 'info' ? tabInfo(p) : activeTab === 'price' ? tabPrice(p) : tabNear(p);

    host.innerHTML =
      '<div class="summary" data-od-id="detail-summary">' +
        '<div class="sum-head">' +
          '<svg class="silhouette" viewBox="0 0 88 88" aria-label="필지 모양">' +
            '<defs><pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" ' +
              'patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--p0)"/>' +
              '<line x1="0" y1="0" x2="0" y2="6" stroke="oklch(80% 0.006 95)" stroke-width="1.6"/>' +
            '</pattern></defs>' +
            '<path d="' + D.silhouette(p.pts, 88) + '" fill="' + fill + '"/></svg>' +
          '<div><div class="addr-town">경기 양평군 ' + p.town + '</div>' +
            '<div class="t-jibun">' + p.ri + ' ' + p.jibun + '</div></div>' +
          '<button class="close" id="closebtn" aria-label="선택 해제">' +
            '<svg width="19" height="19" viewBox="0 0 19 19" aria-hidden="true">' +
              '<path d="M3 3 L16 16 M16 3 L3 16" stroke="currentColor" stroke-width="1.6"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="total-row"><span class="t-total">' + D.won(p.total) + '</span></div>' +
        '<div style="margin-top:10px"><span class="basis">2026년 공시</span></div>' +
        (p.rate == null ? '<div class="unit">공시지가 정보 없음</div>' :
          '<div class="unit">㎡당 ' + D.num(p.rate) + '원 · 평당 ' + D.num(D.ratePyeong(p.rate)) + '원</div>') +
      '</div>' +
      '<div class="tabs" role="tablist" data-od-id="detail-tabs">' +
        tabBtn('info', '땅 정보') + tabBtn('price', '시세') + tabBtn('near', '주변') +
      '</div>' +
      '<div class="tabbody" role="tabpanel">' + body + '</div>' +
      '<div class="panel-foot"><a class="link" href="land-detail-page.html">이 땅의 상세 페이지 →</a></div>';

    $('closebtn').addEventListener('click', function () { select(null); });
    host.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () { activeTab = b.getAttribute('data-tab'); render(); });
    });
  }

  function select(id, recenter) {
    var prev = selected && document.getElementById('s-' + selected);
    if (prev) prev.classList.remove('sel');
    selected = id;
    if (id) {
      var el = document.getElementById('s-' + id);
      if (el) el.classList.add('sel');
      if (recenter) {
        var p = byId[id];
        view.cx = p.cx; view.cy = p.cy;
        view.zi = Math.max(view.zi, 3);
        applyView();
      }
      activeTab = activeTab || 'info';
    }
    render();
  }

  /* ── 검색 ─────────────────────────────── */
  var q = $('q'), resBox = $('results'), debounce = null;
  q.addEventListener('input', function () {
    clearTimeout(debounce);
    debounce = setTimeout(runSearch, 250);
  });
  function runSearch() {
    var v = q.value.trim();
    if (!v) { resBox.hidden = true; resBox.innerHTML = ''; return; }
    var terms = v.split(/\s+/);
    var hits = parcels.filter(function (p) {
      var hay = p.town + ' ' + p.ri + ' ' + p.jibun;
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    }).slice(0, 20);
    resBox.hidden = false;
    if (!hits.length) {
      resBox.innerHTML = '<div style="padding:16px" class="t-label">‘' + v +
        '’에 해당하는 필지가 없습니다. 지번을 확인해 주세요</div>';
      return;
    }
    resBox.innerHTML = hits.map(function (p) {
      return '<button class="result" data-id="' + p.id + '">' +
        '<span><span class="result-jibun">' + p.ri + ' ' + p.jibun + '</span> ' +
        '<span class="result-meta">' + p.jimok + '</span></span>' +
        '<span class="result-rate">' + (p.rate == null ? '정보 없음' : '㎡당 ' + D.num(p.rate) + '원') +
        '</span></button>';
    }).join('');
    resBox.querySelectorAll('.result').forEach(function (b) {
      b.addEventListener('click', function () {
        select(b.getAttribute('data-id'), true);
        resBox.hidden = true; q.value = '';
      });
    });
  }

  $('zin').addEventListener('click', function () {
    if (view.zi < ZOOMS.length - 1) { view.zi++; applyView(); }
  });
  $('zout').addEventListener('click', function () {
    if (view.zi > 0) { view.zi--; applyView(); }
  });

  drawBase(); drawParcels();
  // 첫 화면에 상세 구조가 바로 보이도록 대표 필지를 하나 선택해 둔다.
  // 화면 가장자리로 잘리지 않게 지도 안쪽에서 고른다
  var seed = parcels.filter(function (p) {
    return p.rate && p.bin >= 3 && p.area > 900 &&
           p.cx > 260 && p.cx < 740 && p.cy > 220 && p.cy < 480;
  })[0] || parcels[0];
  view.cx = seed.cx; view.cy = seed.cy; view.zi = 2;
  applyView(); select(seed.id, false);
  window.addEventListener('resize', applyView);
})();
</script>
</body>
</html>
